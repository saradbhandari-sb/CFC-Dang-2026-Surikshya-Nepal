<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#dc143c">
  <title>Surakshya Nepal | Report, Hospital & SOS Services</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .flag{font-size:1.35rem;line-height:1}.blue{color:#003893}.filters{margin:24px 0 14px;padding:12px 22px}.district-note{font-size:.9rem;color:#66738b;margin:12px 0 18px}.hospital-list{display:grid;gap:16px}.hospital-detail{padding:24px}.hospital-title{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.hospital-title h3{font:700 1.3rem Outfit;margin:8px 0 5px}.hospital-title p,.wait{margin:0;color:#66738b;font-size:.9rem}.type{background:#edf3ff;color:#003893}.live-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:9px;margin:20px 0}.live-grid span{padding:11px 8px;border-radius:10px;background:#f5f8fd;color:#66738b;font-size:.73rem}.live-grid b{display:block;color:#16233d;font:700 1.1rem Outfit}.wait a{color:#003893;font-weight:700}.hospital-actions{display:flex;gap:10px;margin-top:17px;align-items:center}.nav-link{padding:11px 15px;border-radius:10px;background:#003893;color:white;text-decoration:none;font-weight:700;font-size:.9rem}.tag.amber{color:#a66000;background:#fff3df}.tag.full{color:#dc143c;background:#fff0f2}.doctor-list{margin-top:18px;padding-top:16px;border-top:1px solid #e4e9f2;display:grid;gap:12px}.doctor{display:flex;gap:12px;padding:12px;border-radius:12px;background:#fafbfe}.doctor-photo{flex:0 0 43px;height:43px;border-radius:50%;display:grid;place-items:center;background:#003893;color:#fff;font-weight:700}.doctor h4{font:700 1rem Outfit;margin:0}.doctor p{margin:3px 0;color:#66738b;font-size:.82rem}.available,.unavailable{font:700 .7rem 'DM Sans',sans-serif;padding:3px 7px;border-radius:99px}.available{background:#e7f7ef;color:#148464}.unavailable{background:#fff3df;color:#a66000}@media(max-width:780px){.live-grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:450px){.hospital-title{flex-direction:column}.live-grid{grid-template-columns:repeat(2,1fr)}}
  </style>
</head>
<body>
  <div id="splash" class="splash" aria-label="Loading Surakshya Nepal"><div class="mountains"></div><div class="flag-mark"><i></i><span>🇳🇵</span></div><div class="splash-copy"><p class="eyebrow">GOVERNMENT OF NEPAL</p><h1>SURAKSHYA <em>NEPAL</em></h1><p>Your Safety, Our Priority.</p><div class="loader"><b></b></div></div></div>
  <main id="app"></main>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
